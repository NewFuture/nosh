[package]
name = "nosh-shell"
description = "Embedded bash-compatible shell (brush-core), REPL and AI trigger pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
brush-builtins.workspace = true
brush-core.workspace = true
brush-parser.workspace = true
crossterm.workspace = true
libc.workspace = true
nosh-hub.workspace = true
nu-ansi-term.workspace = true
reedline.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
vte.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Use poll instead of kqueue for /dev/tty when stdin is redirected.
crossterm = { workspace = true, features = ["use-dev-tty"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
