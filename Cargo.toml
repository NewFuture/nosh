[workspace]
resolver = "3"
members = ["crates/*", "tests"]
default-members = ["crates/*", "tests"]
exclude = ["third_party", ".nosh", "tools/source"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/NewFuture/nosh"
publish = false

[workspace.dependencies]
nosh-core = { path = "crates/nosh-core" }
nosh-shell = { path = "crates/nosh-shell" }
nosh-permissions = { path = "crates/nosh-permissions" }
nosh-llm = { path = "crates/nosh-llm" }
nosh-hub = { path = "crates/nosh-hub" }

anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libc = "0.2"

# shell
brush-core = "0.5.0"
brush-parser = "0.4.0"
brush-builtins = "0.2.0"
reedline = { version = "=0.52.0", path = ".nosh/reedline" }
crossterm = "0.29.0"
nu-ansi-term = "0.50.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
# Keep the bounded, zero-sized OSC buffer rather than std's growable buffer.
vte = { version = "0.15.0", default-features = false }
signal-hook = "0.4.4"
filedescriptor = "0.8.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "time", "macros", "sync"] }

# inference: pinned candle main rev (runtime AVX2/AVX-512 dispatch, tokenizers 0.23 + fancy-regex);
# candle-core itself comes from third_party/candle-core (same rev plus one patch, see [patch] below)
candle-core = { git = "https://github.com/huggingface/candle", rev = "5ba5d5b468b5b1df40e82dd3d556987bedeea041" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "5ba5d5b468b5b1df40e82dd3d556987bedeea041" }
gemm = "0.19.0"
half = "2.7.1"
memchr = "2.8.3"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

# hub
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.0"
fs4 = "1.1.0"
indicatif = "0.18.6"

# tools
ignore = "0.4.33"
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"

# tests
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"

# candle-core at the pinned rev with `QTensor::prepack_and_release_storage`
# (drops raw CPU blocks once their tiles serve every m); candle-nn from the same git
# source links against it. See third_party/candle-core/NOSH_PATCH.md.
[patch."https://github.com/huggingface/candle"]
candle-core = { path = "third_party/candle-core" }

# gemm-f16's aarch64 kernels are `#[target_feature(enable = "fp16")]` functions
# calling `#[inline]` helpers whose asm (`fmla v.8h`) needs fp16. Unoptimized,
# the helpers are compiled on their own, without the feature, and the
# assembler rejects them where the target baseline lacks fp16 (aarch64 Linux;
# Apple's baseline has it). Optimized they are inlined into their callers;
# the CPU is still checked at runtime. sarah-quinones/gemm#31.
[profile.dev.package.gemm-f16]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# Faster local iteration for model tests: `cargo test --profile fastrel -- --ignored`.
[profile.fastrel]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
incremental = true
