[workspace]
resolver = "3"
members = ["crates/*", "tests"]
default-members = ["crates/*", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/NewFuture/nosh"
publish = false

[workspace.dependencies]
nosh-core = { path = "crates/nosh-core" }
nosh-shell = { path = "crates/nosh-shell" }
nosh-permissions = { path = "crates/nosh-permissions" }
nosh-llm = { path = "crates/nosh-llm" }
nosh-hub = { path = "crates/nosh-hub" }

anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libc = "0.2"

# shell
brush-core = "0.5.0"
brush-parser = "0.4.0"
brush-builtins = "0.2.0"
reedline = "0.51.0"
crossterm = "0.29.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "time", "macros", "sync"] }

# inference: pinned candle main rev (runtime AVX2/AVX-512 dispatch, tokenizers 0.23 + fancy-regex)
candle-core = { git = "https://github.com/huggingface/candle", rev = "9b1be4a321ef265f13d2c30be4f2037109c51d14" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "9b1be4a321ef265f13d2c30be4f2037109c51d14" }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

# hub
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.0"
fs4 = "1.1.0"
indicatif = "0.18.6"

# tools
ignore = "0.4.33"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# Faster local iteration for model tests: `cargo test --profile fastrel -- --ignored`.
[profile.fastrel]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
incremental = true
