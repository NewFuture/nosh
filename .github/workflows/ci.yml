name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Regular CI runs fmt once, on x86_64; every regular job runs clippy and tests. The last step
# prints the CPU features that pick candle's kernels, with what the prepack
# tests found on them, also when an earlier step failed.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: prepare patched sources before Cargo metadata
        run: cargo run --manifest-path tools/source/Cargo.toml --locked -- prepare --offline
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/source/Cargo.toml -- --check
          cargo fmt --manifest-path .nosh/reedline/Cargo.toml -- --check
          cargo fmt --manifest-path .nosh/brush/Cargo.toml -p brush-core -- --check
      - name: source lifecycle
        run: |
          cargo test --manifest-path tools/source/Cargo.toml --locked
          cargo clippy --manifest-path tools/source/Cargo.toml --all-targets --locked -- -D warnings
          cargo run --manifest-path tools/source/Cargo.toml --locked -- check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Also part of `test`; run on its own so the metrics show on success.
      - name: ai trigger corpus
        run: cargo test --workspace --locked --test trigger_corpus -- --show-output
      - name: test
        run: cargo test --workspace --locked
      - name: minimum supported Bash integration
        env:
          BASH_VERSION_UNDER_TEST: '5.1'
          BASH_SHA256: 'cc012bc860406dcf42f64431bcd3d2fa7560c02915a601aba9cd597a39329baa'
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/nosh-bash"
          mkdir -p "$build_dir"
          archive="$build_dir/bash.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://ftp.gnu.org/gnu/bash/bash-${BASH_VERSION_UNDER_TEST}.tar.gz" --output "$archive"
          printf '%s  %s\n' "$BASH_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$build_dir"
          source_dir="$build_dir/bash-${BASH_VERSION_UNDER_TEST}"
          (cd "$source_dir" && CC='gcc -std=gnu89' ./configure --quiet --without-bash-malloc --disable-nls && make -s -j2 bash)
          NOSH_TEST_BASH="$source_dir/bash" cargo test -p nosh-cli --test init --locked
      - name: Starship theme compatibility
        env:
          STARSHIP_VERSION: '1.26.0'
          STARSHIP_SHA256: 'b7c232b0e8249d8e55a40beb79c5c43a7d370f3f9408bd215deb0170daeaadf3'
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/nosh-starship"
          mkdir -p "$install_dir"
          archive="$install_dir/starship.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/starship/starship/releases/download/v${STARSHIP_VERSION}/starship-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$STARSHIP_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" starship
          export PATH="$install_dir:$PATH"
          starship --version
          cargo test -p nosh-cli --bin nosh --test theme --locked -- --ignored
      - name: patched editor regressions
        run: cargo test --manifest-path .nosh/reedline/Cargo.toml --lib --features external_printer --locked --target-dir target/reedline
      - name: completion regressions
        run: |
          cargo test -p nosh-shell --lib completion --locked
          cargo test -p nosh-core --test terminal completion --locked
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
      - name: current npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: evaluation runner tests (no model)
        env:
          NOSH_TEST_BINARY: ${{ github.workspace }}/target/debug/nosh
        run: python3 -m unittest eval.tests -v
      - name: cpu features and kernel paths
        if: success() || failure()
        run: cargo test --workspace --locked --test prepack -- --nocapture --test-threads 1

  # Linux arm64 (2 vCPU, 8 GB for private repositories), on every run.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: clippy
      - name: prepare patched sources before Cargo metadata
        run: cargo run --manifest-path tools/source/Cargo.toml --locked -- prepare --offline
      - uses: Swatinem/rust-cache@v2.9.2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: cpu features and kernel paths
        if: success() || failure()
        run: cargo test --workspace --locked --test prepack -- --nocapture --test-threads 1

  # Apple Silicon (M1, 3 vCPU, 7 GB). About 10x the per-minute price of Linux
  # x64, so only for pull requests, main and manual runs.
  macos:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: clippy
      - name: prepare patched sources before Cargo metadata
        run: cargo run --manifest-path tools/source/Cargo.toml --locked -- prepare --offline
      - uses: Swatinem/rust-cache@v2.9.2
      - name: supported Bash for integration tests
        run: |
          if ! brew list --versions bash >/dev/null; then brew install bash; fi
          echo "NOSH_TEST_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          echo "NOSH_TEST_OLD_BASH=/bin/bash" >> "$GITHUB_ENV"
      - name: source lifecycle
        run: cargo test --manifest-path tools/source/Cargo.toml --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: cpu features and kernel paths
        if: success() || failure()
        run: cargo test --workspace --locked --test prepack -- --nocapture --test-threads 1

  editor-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: prepare patched sources before Cargo metadata
        run: cargo run --manifest-path tools/source/Cargo.toml --locked -- prepare --offline
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            tools/source -> target
            .nosh/reedline -> ../../target/reedline
      - name: engine and platform contracts
        run: cargo test -p nosh-engine -p nosh-platform --locked
      - name: source lifecycle
        run: cargo test --manifest-path tools/source/Cargo.toml --locked
      - name: patched editor regressions
        run: cargo test --manifest-path .nosh/reedline/Cargo.toml --lib --features external_printer --locked --target-dir target/reedline
