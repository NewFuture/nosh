name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version without v, for example 0.2.0 or 0.2.0-rc.1'
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: prepare patched sources
        run: cargo source prepare --offline
      - name: update and commit version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python .github/scripts/release.py version "$RELEASE_VERSION"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    outputs:
      artifact_count: ${{ strategy.job-total }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: prepare patched sources
        run: cargo source prepare --offline
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Unix contracts
        if: runner.os != 'Windows'
        run: cargo test -p nosh-tests --target "$RELEASE_TARGET" --locked
      - name: native Windows regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test -p nosh-cli -p nosh-permissions --test windows --target "$env:RELEASE_TARGET" --locked
      - name: build native CPU executable
        shell: bash
        run: cargo build -p nosh-cli --release --target "$RELEASE_TARGET" --locked
      - name: verify and package executable
        shell: bash
        run: python .github/scripts/release.py package "$RELEASE_VERSION" "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nosh-${{ matrix.target }}
          path: ${{ runner.temp }}/nosh-release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: nosh-*
          merge-multiple: true
          path: ${{ runner.temp }}/nosh-release
      - name: verify all assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          RELEASE_ARTIFACT_COUNT: ${{ needs.build.outputs.artifact_count }}
        run: python .github/scripts/release.py publish "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_ARTIFACT_COUNT"
