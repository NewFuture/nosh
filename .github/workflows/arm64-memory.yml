name: ARM64 memory

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: ARM experiment to run
        type: choice
        options: [memory, kv-cache]
        default: memory
      kv_cases:
        description: "KV manifest IDs, comma-separated; 'all' runs all ten"
        type: string
        default: all

run-name: ARM64 ${{ inputs.experiment || 'memory' }} @ ${{ github.ref_name }}

concurrency:
  group: arm64-memory-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CANDLE_NUM_THREADS: 2
  RAYON_NUM_THREADS: 1

jobs:
  memory:
    if: inputs.experiment != 'kv-cache'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-memory-release
      - name: isolated model store and artifacts
        run: |
          echo "NOSH_HOME=$RUNNER_TEMP/nosh-arm64" >> "$GITHUB_ENV"
          echo "NOSH_MEMORY_ARTIFACTS=$GITHUB_WORKSPACE/target/arm64-memory" >> "$GITHUB_ENV"
          mkdir -p target/arm64-memory
          {
            git rev-parse HEAD
            rustc -Vv
            lscpu
            echo "release profile; CANDLE_NUM_THREADS=2; RAYON_NUM_THREADS=1"
          } > target/arm64-memory/environment.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nosh-arm64/models
          key: arm64-memory-model-${{ hashFiles('assets/registry.toml') }}
      - name: release build
        run: cargo build --release --locked -p nosh-cli
      - name: download and verify pinned model
        run: |
          target/release/nosh model pull minicpm5-2b:q4_k_m --source hf
          target/release/nosh model verify minicpm5-2b:q4_k_m
          sha256sum target/release/nosh >> "$NOSH_MEMORY_ARTIFACTS/environment.txt"
      - name: 8K peak RSS and generated outputs
        env:
          NOSH_OFFLINE: "1"
        run: |
          cargo test --release --locked -p nosh-cli --test arm64_memory arm64_8k_rss_and_outputs -- --ignored --exact --nocapture --test-threads 1 2>&1 | tee "$NOSH_MEMORY_ARTIFACTS/memory.log"
      - name: teacher-forced numerical acceptance
        if: success() || failure()
        env:
          NOSH_OFFLINE: "1"
        run: |
          cargo test --release --locked -p nosh-llm --test real_model prepacked_weights_match_retained_weights -- --ignored --exact --nocapture --test-threads 1 2>&1 | tee "$NOSH_MEMORY_ARTIFACTS/numerical.log"
      - name: acceptance summary
        if: always()
        run: |
          {
            echo "## ARM64 prepack acceptance"
            echo "Commit: $GITHUB_SHA. RSS limit: 2.5 GiB (2,621,440 KiB). No speed gate."
            for report in memory.json numerical.log; do
              echo "### $report"
              if test -f "$NOSH_MEMORY_ARTIFACTS/$report"; then
                echo '```'
                cat "$NOSH_MEMORY_ARTIFACTS/$report"
                echo
                echo '```'
              else
                echo "No result produced; inspect the failed step and artifacts."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-memory-${{ github.sha }}
          path: target/arm64-memory
          if-no-files-found: error

  kv-matrix:
    if: inputs.experiment == 'kv-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        env:
          KV_CASES: ${{ inputs.kv_cases || 'all' }}
        run: |
          cases=$(python3 -m eval.kv_cache matrix --cases "$KV_CASES")
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  kv-cache:
    needs: kv-matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.kv-matrix.outputs.cases) }}
    env:
      KV_ROOT: ${{ github.workspace }}/target/kv-cache
      KV_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: record runner and check benchmark
        run: |
          mkdir -p "$KV_ROOT/results"
          {
            git rev-parse HEAD
            uname -a
            lscpu
            c++ --version
            python3 --version
          } > "$KV_ROOT/results/build-environment.txt"
          python3 -m unittest eval.tests.test_kv_cache -q
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: fc343a84bbd925b37dde3219de35ea0bed50d630
          path: target/kv-cache/llama.cpp
          persist-credentials: false
      - name: build pinned native CPU reference
        timeout-minutes: 15
        run: |
          cmake -S "$KV_ROOT/llama.cpp" -B "$KV_ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF \
            -DGGML_BLAS=OFF -DGGML_CPU_KLEIDIAI=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            2>&1 | tee "$KV_ROOT/results/build.log"
          cmake --build "$KV_ROOT/build" --parallel 2 \
            --target llama-server llama-quantize 2>&1 | tee -a "$KV_ROOT/results/build.log"
          cp "$KV_ROOT/build/CMakeCache.txt" "$KV_ROOT/results/CMakeCache.txt"
          "$KV_ROOT/build/bin/llama-server" --version >> "$KV_ROOT/results/build-environment.txt" 2>&1
      - name: build separate reproducible model quantizer
        if: matrix.quantize
        timeout-minutes: 10
        run: |
          cmake -S "$KV_ROOT/llama.cpp" -B "$KV_ROOT/quantize-build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON \
            -DCMAKE_C_FLAGS=-ffp-contract=off -DCMAKE_CXX_FLAGS=-ffp-contract=off \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF \
            -DGGML_BLAS=OFF -DGGML_CPU_KLEIDIAI=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            2>&1 | tee "$KV_ROOT/results/quantizer-build.log"
          cmake --build "$KV_ROOT/quantize-build" --parallel 2 --target llama-quantize \
            2>&1 | tee -a "$KV_ROOT/results/quantizer-build.log"
          cp "$KV_ROOT/quantize-build/CMakeCache.txt" "$KV_ROOT/results/quantizer-CMakeCache.txt"
      - name: install pinned HF conversion dependencies
        if: matrix.hf
        timeout-minutes: 10
        run: |
          python3 -m pip install --disable-pip-version-check -q -r eval/kv_cache_requirements.txt
          python3 -m pip freeze > "$KV_ROOT/results/conversion-packages.txt"
      - name: prepare and verify the exact x86 reference weight
        timeout-minutes: 15
        env:
          QUANTIZE: ${{ matrix.quantize }}
        run: |
          args=()
          if [[ "$QUANTIZE" == "true" ]]; then
            args+=(--quantizer "$KV_ROOT/quantize-build/bin/llama-quantize")
          fi
          python3 -u -m eval.kv_cache prepare --root "$KV_ROOT" --case "$KV_CASE" "${args[@]}"
      - name: two-core reversed-order f16 and q8 KV requests
        timeout-minutes: 40
        run: |
          python3 -u -m eval.kv_cache run --root "$KV_ROOT" --case "$KV_CASE" --require-arm \
            2>&1 | tee "$KV_ROOT/results/controller.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-kv-${{ matrix.case }}-${{ github.run_id }}
          path: target/kv-cache/results
          retention-days: 7
          if-no-files-found: error

  kv-summary:
    if: always() && inputs.experiment == 'kv-cache'
    needs: [kv-matrix, kv-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: arm-kv-*-${{ github.run_id }}
          path: target/arm-kv-artifacts
      - name: report complete and incomplete comparisons
        env:
          KV_CASES: ${{ inputs.kv_cases || 'all' }}
        run: python3 -m eval.kv_cache report --root target/arm-kv-artifacts --cases "$KV_CASES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-kv-summary-${{ github.run_id }}
          path: |
            target/arm-kv-artifacts/report.json
            target/arm-kv-artifacts/report.md
          retention-days: 7
          if-no-files-found: error
