[package]
name = "nosh-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nosh-gpui"
path = "src/gpui_main.rs"
required-features = ["gpui"]

[features]
gpui = ["dep:gpui", "dep:nosh-cli", "dep:windows-sys"]

[dependencies]
gpui = { version = "=0.2.2", optional = true }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
wgpu = "24"
alacritty_terminal = "=0.25.1"
nosh-platform.workspace = true
nosh-cli = { path = "../crates/nosh-cli", optional = true }
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tempfile.workspace = true
libc.workspace = true
clap.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true
